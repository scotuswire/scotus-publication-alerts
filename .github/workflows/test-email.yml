name: Test email alert

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF text extractor
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - name: Send fifth most recent Supreme Court order
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          from scotus_monitor import fetch, monitored_pages, parse_items, send_email

          page_url = monitored_pages()["Orders"]
          items = parse_items(fetch(page_url), page_url, "Orders")
          if len(items) < 5:
              raise RuntimeError("Fewer than five PDFs found on the Orders page")

          send_email([items[4]])
          print("Sent the fifth most recent PDF from the Orders page.")
          PY
