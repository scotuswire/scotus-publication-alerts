name: Test email alert

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF text extractor
        run: python -m pip install --disable-pip-version-check pypdf==6.1.1
      - name: Send latest Supreme Court PDFs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          from scotus_monitor import fetch, monitored_pages, parse_items, send_email

          latest_items = []
          for category, page_url in monitored_pages().items():
              items = parse_items(fetch(page_url), page_url, category)
              if len(items) < 3:
                  raise RuntimeError(f"Fewer than three PDFs found on the {category} page")
              latest_items.extend(items[:3])

          send_email(latest_items)
          print("Sent the three latest PDFs from each monitored page.")
          PY
