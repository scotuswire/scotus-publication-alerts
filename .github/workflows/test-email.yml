name: Test email alert

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Send latest Supreme Court PDFs
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          from scotus_monitor import fetch, monitored_pages, parse_items, send_email

          latest_items = []

          for category, page_url in monitored_pages().items():
              items = parse_items(fetch(page_url), page_url, category)

              if not items:
                  raise RuntimeError(f"No PDFs found on the {category} page")

              latest_items.append(items[0])

          send_email(latest_items)
          print("Sent the latest PDF from each monitored page.")
          PY
